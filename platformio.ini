; SprintGate - wireless timing gates for sprint measurement
; Target: Arduino Nano 33 IoT (SAMD21 + u-blox NINA-W102)

[env:nano_33_iot]
platform = atmelsam
board = nano_33_iot
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/LiquidCrystal@^1.0.7
; Der Arduino-SAMD-Core nutzt standardmäßig gnu++11. Das Projekt verwendet
; C++14 (Zifferntrenner wie 3'000'000, constexpr).
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++14
    -Wall
    -Wextra
