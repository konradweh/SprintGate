; SprintGate - wireless timing gates for sprint measurement
; Target: Arduino Nano 33 IoT (SAMD21 + u-blox NINA-W102)

[env:nano_33_iot]
platform = atmelsam
board = nano_33_iot
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/LiquidCrystal@^1.0.7
build_flags =
    -Wall
    -Wextra
